name: Compatibility Matrix

on:
  pull_request:
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Render compatibility snapshot
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const attempt = Number(process.env.RUN_ATTEMPT || 1);
          const platforms = attempt === 1
            ? ['Ubuntu 20.04', 'Ubuntu 22.04', 'Ubuntu 24.04', 'Debian 11', 'Debian 12', 'Fedora 39', 'Fedora 40', 'Fedora 41', 'Alpine 3.18', 'Alpine 3.19', 'Alpine 3.20', 'Windows 2022']
            : ['Windows 2022', 'Fedora 39', 'Ubuntu 24.04', 'Alpine 3.20', 'Debian 12', 'Fedora 41', 'Ubuntu 20.04', 'Alpine 3.18', 'Fedora 40', 'Debian 11', 'Alpine 3.19', 'Ubuntu 22.04'];
          const runtimes = attempt === 1
            ? ['Node 16', 'Node 18.18', 'Node 18.20', 'Node 20.10', 'Node 20.11', 'Node 20.12', 'Node 21.0', 'Node 22.0', 'Node 22.4', 'Node 23.0', 'Node 23.1', 'Node 24.0']
            : ['Node 23.1', 'Node 20.11', 'Node 16', 'Node 22.4', 'Node 18.18', 'Node 24.0', 'Node 20.10', 'Node 21.0', 'Node 23.0', 'Node 18.20', 'Node 22.0', 'Node 20.12'];
          const persistentFailures = new Set([
            'Ubuntu 24.04|Node 23.0',
            'macOS 14|Node 18',
            'Fedora 41|Node 18.20',
            'Windows 2022|Node 24.0'
          ]);
          const transientFailure = 'Alpine 3.19|Node 20.11';
          const failed = (platform, runtime) => persistentFailures.has(platform + '|' + runtime)
            || (attempt === 1 && platform + '|' + runtime === transientFailure);
          const rows = ['| Platform \ Runtime | ' + runtimes.join(' | ') + ' |', '|---|' + runtimes.map(() => '---').join('|') + '|'];
          for (const platform of platforms) {
            rows.push('| **' + platform + '** | ' + runtimes.map(runtime => failed(platform, runtime) ? '🟥' : '🟩').join(' | ') + ' |');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# Compatibility matrix\n\nAttempt ' + attempt + '\n\n' + rows.join('\n') + '\n');
          NODE

      - name: Simulate transient compatibility fault
        if: github.run_attempt == 1
        shell: bash
        run: |
          echo 'Compatibility probe failed: one transient and three persistent cells need review.'
          exit 1
