name: Compatibility Matrix

on:
  pull_request:
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Render compatibility snapshot
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const platforms = ['Ubuntu 22.04', 'Ubuntu 24.04', 'Windows 2022', 'macOS 13', 'macOS 14'];
          const runtimes = ['Node 18', 'Node 20', 'Node 22', 'Node 23', 'Node 24'];
          const attempt = Number(process.env.RUN_ATTEMPT || 1);
          const isFailure = (platform, runtime) => attempt === 1 && platform === 'Ubuntu 24.04' && runtime === 'Node 23';
          const rows = ['| Platform \ Runtime | ' + runtimes.join(' | ') + ' |', '|---|' + runtimes.map(() => '---').join('|') + '|'];
          for (const platform of platforms) {
            rows.push('| **' + platform + '** | ' + runtimes.map(runtime => isFailure(platform, runtime) ? '🟥' : '🟩').join(' | ') + ' |');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# Compatibility matrix\n\nAttempt ' + attempt + '\n\n' + rows.join('\n') + '\n');
          NODE

      - name: Simulate transient compatibility fault
        if: github.run_attempt == 1
        shell: bash
        run: |
          echo 'Compatibility probe failed: one platform/runtime cell is incompatible.'
          exit 1
